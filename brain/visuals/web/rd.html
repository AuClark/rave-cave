<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rave Cave · reaction-diffusion lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #dde; font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; top: 8px; left: 8px; width: 300px; max-height: calc(100% - 16px); overflow: auto;
         background: rgba(10, 10, 20, 0.82); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud.hidden { display: none; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  .presets { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 8px; }
  button { background: #2a2a44; color: #eef; border: 0; border-radius: 6px; padding: 5px 8px; font: inherit; cursor: pointer; }
  button.on { background: #6b5bd6; }
  label { display: block; margin: 5px 0 1px; }
  label span { float: right; opacity: 0.7; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  select { width: 100%; background: #2a2a44; color: #eef; border: 0; border-radius: 6px; padding: 4px; }
  #stats { margin-top: 8px; font: 12px ui-monospace, monospace; opacity: 0.85; white-space: pre; }
  #err { color: #ff8a8a; white-space: pre-wrap; }
  #show { position: fixed; top: 8px; left: 8px; display: none; }
  .row { display: flex; gap: 4px; margin-top: 8px; }
  .row button { flex: 1; }
  small { opacity: 0.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="show">☰</button>
<div id="hud">
  <h1>Reaction-diffusion lab</h1>
  <small>Gray-Scott, after <a href="https://www.karlsims.com/rd.html" style="color:#aab">Karl Sims</a>. Draw with a finger or the mouse to add chemical B. <b>H</b> hides this panel.</small>
  <div class="presets" id="presets"></div>
  <label>Feed f <span id="fv"></span><input id="f" type="range" min="0.005" max="0.11" step="0.0005"></label>
  <label>Kill k <span id="kv"></span><input id="k" type="range" min="0.04" max="0.075" step="0.0005"></label>
  <label>Pattern map
    <select id="mode">
      <option value="0">Uniform (one f/k everywhere)</option>
      <option value="1">Map: k across, f up (Karl's crescent)</option>
      <option value="2">Radial: this f/k in the middle → spots at the rim</option>
    </select></label>
  <label>Speed (steps per beat) <span id="spbv"></span><input id="spb" type="range" min="10" max="600" step="5" value="160"></label>
  <label>Resolution (sim pixels per screen pixel) <span id="resv"></span>
    <select id="res"><option value="2">1/2 (fine, heavy)</option><option value="3" selected>1/3</option><option value="4">1/4</option><option value="6">1/6 (coarse, light)</option></select></label>
  <label>Look
    <select id="style"><option value="0">Emergence (Causeret colours)</option><option value="1">Ink (black on paper)</option><option value="2">Neon (show colour)</option><option value="3">Raw (chemical B)</option></select></label>
  <label>Seeds on beat <span id="seedv"></span><input id="seed" type="range" min="0" max="1" step="0.05" value="0.3"></label>
  <label>Feed pulse on beat <span id="pulsev"></span><input id="pulse" type="range" min="0" max="1" step="0.05" value="0"></label>
  <div class="row"><button id="reseed">Reseed</button><button id="clear">Clear</button><button id="pause">Pause</button></div>
  <div id="stats"></div>
  <div id="err"></div>
</div>
<script src="/render.js"></script>
<script>
"use strict";
{   // own scope: render.js (loaded above for ShowClock) has its own globals, e.g. VERT
// Reaction-diffusion lab: a real Gray-Scott simulation, ping-ponged between two textures.
// A standalone test page, not a sketch: it checks what the projector's GPU can run
// before this goes into the shared renderer. Beat-locked: the sim advances a fixed number
// of steps per beat (not per frame), so the pattern grows at the same musical rate at any
// frame rate.

// Karl Sims (karlsims.com/rd.html): default, coral, mitosis. The rest are the values
// commonly used from Robert Munafo's xmorphia catalogue of Pearson's classes.
const PRESETS = [
  ["Default", 0.055, 0.062], ["Coral", 0.0545, 0.062], ["Mitosis", 0.0367, 0.0649],
  ["Mazes", 0.029, 0.057], ["Fingerprint", 0.037, 0.06], ["Worms", 0.078, 0.061],
  ["Solitons", 0.03, 0.062], ["Holes", 0.039, 0.058], ["Spots & loops", 0.018, 0.051],
  ["Moving spots", 0.014, 0.054], ["Waves", 0.014, 0.045], ["Chaos", 0.026, 0.051],
  ["Microbes", 0.022, 0.059], ["U-skate", 0.062, 0.06093],
];

const $ = id => document.getElementById(id);
const canvas = $("c");
const gl = canvas.getContext("webgl", { antialias: false, depth: false, preserveDrawingBuffer: false });
const err = msg => { $("err").textContent = msg; console.error(msg); };
if (!gl) err("No WebGL on this device.");

// ---- storage format: float, else half float, else two bytes per chemical (works everywhere)
function renderable(type, ifmt) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, 4, 4, 0, ifmt, type, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); gl.deleteTexture(t);
  return ok;
}
let TEX = { type: gl.UNSIGNED_BYTE, packed: 1, name: "8-bit packed" };
if (gl.getExtension("OES_texture_float") && (gl.getExtension("WEBGL_color_buffer_float"), renderable(gl.FLOAT, gl.RGBA)))
  TEX = { type: gl.FLOAT, packed: 0, name: "float32" };
else {
  const h = gl.getExtension("OES_texture_half_float");
  gl.getExtension("EXT_color_buffer_half_float");
  if (h && renderable(h.HALF_FLOAT_OES, gl.RGBA)) TEX = { type: h.HALF_FLOAT_OES, packed: 0, name: "float16" };
}
const HIGHP = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision > 0;

// ---- shaders
const HEAD = `
${HIGHP ? "precision highp float;" : "precision mediump float;"}
#define PACKED ${TEX.packed}
uniform sampler2D u_s;
#if PACKED
// Each chemical in two bytes: high byte, then the remainder scaled up.
vec2 enc(float v) { v = clamp(v, 0.0, 0.99998); float h = floor(v * 255.0) / 255.0; return vec2(h, (v - h) * 255.0); }
float dec(vec2 e) { return e.x + e.y / 255.0; }
vec4 store(vec2 ab) { return vec4(enc(ab.x), enc(ab.y)); }
vec2 load(vec2 uv) { vec4 t = texture2D(u_s, uv); return vec2(dec(t.xy), dec(t.zw)); }
#else
vec4 store(vec2 ab) { return vec4(ab, 0.0, 1.0); }
vec2 load(vec2 uv) { return texture2D(u_s, uv).xy; }
#endif
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
`;
const VERT = `attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;

// One Gray-Scott step (Karl Sims's form: dA=1, dB=0.5, dt=1, 3x3 Laplacian -1/.2/.05).
// Edges wrap (fract), so the pattern tiles.
const SIM = HEAD + `
uniform vec2 u_px; uniform float u_f, u_k, u_mode, u_aspect;
uniform vec4 u_brush;            // xy centre (0..1), z radius (surface heights), w > 0 when drawing
vec2 at(vec2 uv, vec2 o) { return load(fract(uv + o * u_px)); }
void main() {
  vec2 uv = gl_FragCoord.xy * u_px;
  vec2 c = at(uv, vec2(0.0));
  vec2 lap = -c
    + 0.2 * (at(uv, vec2(1.0, 0.0)) + at(uv, vec2(-1.0, 0.0)) + at(uv, vec2(0.0, 1.0)) + at(uv, vec2(0.0, -1.0)))
    + 0.05 * (at(uv, vec2(1.0, 1.0)) + at(uv, vec2(-1.0, 1.0)) + at(uv, vec2(1.0, -1.0)) + at(uv, vec2(-1.0, -1.0)));
  float f = u_f, k = u_k;
  if (u_mode > 0.5 && u_mode < 1.5) { k = mix(0.045, 0.07, uv.x); f = mix(0.01, 0.1, uv.y); }
  if (u_mode > 1.5) {
    float r = length((uv - 0.5) * vec2(u_aspect, 1.0)) / 0.5;
    float t = smoothstep(0.35, 0.95, r);
    f = mix(u_f, 0.03, t); k = mix(u_k, 0.062, t);
  }
  float A = c.x, B = c.y, abb = A * B * B;
  A += 1.0 * lap.x - abb + f * (1.0 - A);
  B += 0.5 * lap.y + abb - (k + f) * B;
  if (u_brush.w > 0.0 && length((uv - u_brush.xy) * vec2(u_aspect, 1.0)) < u_brush.z) B = 0.9;
  gl_FragColor = store(clamp(vec2(A, B), 0.0, 1.0));
}`;

// Starting state: all A, with small square seeds of B scattered about.
const INIT = HEAD + `
uniform vec2 u_px; uniform float u_seed, u_aspect, u_fill;
void main() {
  vec2 uv = gl_FragCoord.xy * u_px;
  vec2 g = uv * vec2(u_aspect, 1.0) * 16.0;
  vec2 fr = fract(g) - 0.5;
  float B = (u_fill > 0.5 && hash(floor(g) + u_seed) > 0.88 && max(abs(fr.x), abs(fr.y)) < 0.22) ? 1.0 : 0.0;
  gl_FragColor = store(vec2(1.0, B));
}`;

// Screen: bilinear from the sim by hand (packed values can't be filtered), then colour.
const SHOW = HEAD + `
uniform vec2 u_res, u_sim; uniform float u_style, u_kick, u_hue, u_aspect;
vec2 bil(vec2 uv) {
  vec2 p = uv * u_sim - 0.5, i = floor(p), f = fract(p);
  vec2 a = load(fract((i + vec2(0.5, 0.5)) / u_sim)), b = load(fract((i + vec2(1.5, 0.5)) / u_sim));
  vec2 c = load(fract((i + vec2(0.5, 1.5)) / u_sim)), d = load(fract((i + vec2(1.5, 1.5)) / u_sim));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
vec3 hsv(float h, float s, float v) {
  vec3 k = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return v * mix(vec3(1.0), k, s);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 ab = bil(uv);
  float B = ab.y;
  float w = 0.03;                                            // edge softness in B units (edge0 < edge1)
  float ink = smoothstep(0.2 - w, 0.2 + w, B);
  vec3 col;
  if (u_style < 0.5) {                                       // Causeret zones: blue core, mixed band, teal rim
    vec2 p = (uv - 0.5) * vec2(u_aspect, 1.0);
    float z = length(p) / 0.5 + (vnoise(p * 6.0 + 40.0) - 0.5) * 0.35;
    float pick = vnoise(mat2(0.6, 0.8, -0.8, 0.6) * p * 9.0 + 80.0);
    vec3 hs = z < 0.5 ? vec3(0.56, 0.62, 0.80)
            : z < 0.8 ? (pick < 0.4 ? vec3(0.92, 0.72, 0.86) : pick < 0.62 ? vec3(0.30, 0.58, 0.45) : vec3(0.60, 0.22, 0.88))
            :           vec3(0.48, 0.62, 0.84);
    col = hsv(hs.x, hs.y, hs.z) * ink;
  } else if (u_style < 1.5) {                                // ink on paper
    col = mix(vec3(0.95, 0.93, 0.88), vec3(0.08, 0.07, 0.1), ink);
  } else if (u_style < 2.5) {                                // neon in the show's colour
    col = hsv(u_hue + B * 0.5, 0.85, 1.0) * (ink * 0.85 + smoothstep(0.05, 0.35, B) * 0.35);
  } else {
    col = vec3(clamp(B * 2.5, 0.0, 1.0));
  }
  gl_FragColor = vec4(col * (0.85 + 0.15 * u_kick), 1.0);
}`;

function program(fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, VERT)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "a"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
let P;
try { P = { sim: program(SIM), init: program(INIT), show: program(SHOW) }; } catch (e) { err(String(e)); }

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ---- ping-pong buffers
let W = 0, H = 0, simW = 0, simH = 0, bufs = [], cur = 0;
function target() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);   // non-power-of-two: wrap by hand
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, simW, simH, 0, gl.RGBA, TEX.type, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, fb };
}
function draw(prog, into, from) {
  gl.useProgram(prog.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, into ? into.fb : null);
  gl.viewport(0, 0, into ? simW : W, into ? simH : H);
  if (from) { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, from.t); gl.uniform1i(prog.u.u_s, 0); }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function seed(fill) {
  const u = P.init.u;
  gl.useProgram(P.init.p);
  gl.uniform2f(u.u_px, 1 / simW, 1 / simH); gl.uniform1f(u.u_aspect, simW / simH);
  gl.uniform1f(u.u_seed, Math.random() * 1000); gl.uniform1f(u.u_fill, fill ? 1 : 0);
  draw(P.init, bufs[cur]);
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  canvas.width = W; canvas.height = H;
  const div = +$("res").value;
  const sw = Math.max(32, Math.round(innerWidth / div)), sh = Math.max(32, Math.round(innerHeight / div));
  if (sw === simW && sh === simH) return;
  for (const b of bufs) { gl.deleteTexture(b.t); gl.deleteFramebuffer(b.fb); }
  simW = sw; simH = sh; bufs = [target(), target()]; cur = 0;
  seed(true);
}

// ---- controls
const state = { f: 0.055, k: 0.062, paused: false, brush: null };
function setPreset(name, f, k) {
  state.f = f; state.k = k; $("f").value = f; $("k").value = k;
  for (const b of document.querySelectorAll("#presets button")) b.classList.toggle("on", b.textContent === name);
  labels();
}
for (const [name, f, k] of PRESETS) {
  const b = document.createElement("button"); b.textContent = name;
  b.onclick = () => { setPreset(name, f, k); seed(true); };
  $("presets").appendChild(b);
}
function labels() {
  $("fv").textContent = state.f.toFixed(4); $("kv").textContent = state.k.toFixed(4);
  $("spbv").textContent = $("spb").value; $("seedv").textContent = $("seed").value; $("pulsev").textContent = $("pulse").value;
}
$("f").oninput = () => { state.f = +$("f").value; labels(); };
$("k").oninput = () => { state.k = +$("k").value; labels(); };
for (const id of ["spb", "seed", "pulse"]) $(id).oninput = labels;
$("res").onchange = resize;
$("reseed").onclick = () => seed(true);
$("clear").onclick = () => seed(false);
$("pause").onclick = () => { state.paused = !state.paused; $("pause").classList.toggle("on", state.paused); };
const toggleHud = () => { $("hud").classList.toggle("hidden"); $("show").style.display = $("hud").classList.contains("hidden") ? "block" : "none"; };
$("show").onclick = toggleHud;
addEventListener("keydown", e => { if (e.key === "h" || e.key === "H") toggleHud(); });
const pointer = e => {
  if (!(e.buttons & 1) && e.type !== "pointerdown") { state.brush = null; return; }
  state.brush = [e.clientX / innerWidth, 1 - e.clientY / innerHeight];
};
canvas.addEventListener("pointerdown", pointer);
canvas.addEventListener("pointermove", pointer);
addEventListener("pointerup", () => { state.brush = null; });
addEventListener("resize", resize);

// ---- show clock (showbrain via the visuals service; 120 BPM idle clock without it)
const clock = new ShowClock();
new EventSource("/api/events").onmessage = ev => {           // EventSource reconnects by itself
  try { const m = JSON.parse(ev.data); if (m.t === "state") clock.update(m.s); } catch (e) {}
};

// ---- main loop
let lastBeat = null, carry = 0, frames = 0, statT = performance.now(), stepsDone = 0, lastScene = -1;
const MAX_STEPS = 40;                                         // per frame, so a slow GPU can't spiral
function frame(now) {
  requestAnimationFrame(frame);
  if (!P) return;
  const s = clock.frame(now);
  const kick = Math.exp(-6 * s.frac);
  if (lastBeat === null) lastBeat = s.beat;
  const dBeats = Math.max(0, Math.min(1, s.beat - lastBeat));
  const newBeat = Math.floor(s.beat) !== Math.floor(lastBeat);
  lastBeat = s.beat;

  // Beat seeds: a drop of B somewhere on each beat (more on beat 1, a burst on DROP).
  const seedAmt = +$("seed").value;
  let drops = [];
  if (newBeat && seedAmt > 0) {
    const n = (s.bwb === 1 ? 2 : 1) * (Math.random() < seedAmt ? 1 : 0) + (s.scene === SCENES.DROP && lastScene !== SCENES.DROP ? 12 : 0);
    for (let i = 0; i < n; i++) drops.push([Math.random(), Math.random(), 0.01 + 0.02 * seedAmt]);
  }
  lastScene = s.scene;

  let steps = 0;
  if (!state.paused) { carry += dBeats * +$("spb").value; steps = Math.min(MAX_STEPS, Math.floor(carry)); carry -= Math.floor(carry); }
  const u = P.sim.u, fPulse = +$("pulse").value * 0.006 * kick;
  gl.useProgram(P.sim.p);
  gl.uniform2f(u.u_px, 1 / simW, 1 / simH); gl.uniform1f(u.u_aspect, simW / simH);
  gl.uniform1f(u.u_f, state.f + fPulse); gl.uniform1f(u.u_k, state.k); gl.uniform1f(u.u_mode, +$("mode").value);
  for (let i = 0; i < Math.max(steps, drops.length ? 1 : 0, state.brush ? 1 : 0); i++) {
    const br = i === 0 && state.brush ? [...state.brush, 0.015, 1] : i < drops.length ? [...drops[i], 1] : [0, 0, 0, 0];
    gl.uniform4f(u.u_brush, br[0], br[1], br[2], br[3]);
    draw(P.sim, bufs[1 - cur], bufs[cur]); cur = 1 - cur; stepsDone++;
  }

  const v = P.show.u;
  gl.useProgram(P.show.p);
  gl.uniform2f(v.u_res, W, H); gl.uniform2f(v.u_sim, simW, simH);
  gl.uniform1f(v.u_style, +$("style").value); gl.uniform1f(v.u_kick, kick);
  gl.uniform1f(v.u_hue, s.hue); gl.uniform1f(v.u_aspect, W / H);
  draw(P.show, null, bufs[cur]);

  frames++;
  if (now - statT > 500) {
    const dt = (now - statT) / 1000;
    $("stats").textContent =
      `${(frames / dt).toFixed(0)} fps   ${(stepsDone / dt).toFixed(0)} steps/s\n` +
      `sim ${simW}×${simH}  screen ${W}×${H}\n` +
      `storage ${TEX.name}  ${HIGHP ? "highp" : "mediump!"}\n` +
      `beat ${s.beat.toFixed(1)}  ${s.scene === SCENES.IDLE ? "idle clock 120 BPM" : "live"}`;
    frames = 0; stepsDone = 0; statT = now;
  }
}
// URL options, e.g. rd.html?preset=Mazes&look=1&res=4&mode=2&hud=0 (bookmark a look on the projector).
const q = new URLSearchParams(location.search);
for (const [id, key] of [["style", "look"], ["res", "res"], ["mode", "mode"], ["spb", "speed"], ["seed", "seeds"], ["pulse", "pulse"]])
  if (q.has(key)) $(id).value = q.get(key);
if (q.get("hud") === "0") toggleHud();
resize();
const pre = PRESETS.find(p => p[0].toLowerCase() === (q.get("preset") || "coral").toLowerCase()) || PRESETS[1];
setPreset(...pre);
if (q.has("f")) { state.f = +q.get("f"); $("f").value = state.f; }
if (q.has("k")) { state.k = +q.get("k"); $("k").value = state.k; }
labels();
seed(true);
requestAnimationFrame(frame);
}
</script>
</body>
</html>
