<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rave Cave · Visuals</title>
<style>
  :root { --bg: #0c0d14; --card: #151724; --line: #2a2d42; --text: #e8e9f3; --dim: #8a8ea8; --acc: #2fe6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .08em; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #3a2030; color: #f99; }
  .pill.ok { background: #183a2a; color: #8f8; }
  .grow { flex: 1; }
  a { color: var(--acc); }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 420px); gap: 14px; padding: 14px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } #previewWrap { position: sticky; top: 50px; z-index: 1; } }
  #previewWrap { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  #previewWrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); display: flex; }
  .card h3 button { margin-left: auto; font-size: 11px; padding: 2px 8px; }
  .p { display: grid; grid-template-columns: 1fr auto; align-items: center; margin: 4px 0 2px; }
  .p span { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--acc); margin: 0 0 4px; }
  .row { display: flex; gap: 6px; margin: 6px 0; }
  button, select, input[type=text] { font: inherit; color: var(--text); background: #1b1e2e; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  button:active { background: #262a40; }
  .hint { color: var(--dim); font-size: 12px; }
  #err { color: #f88; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>RAVE CAVE · VISUALS</h1>
  <select id="sketch"></select>
  <span class="grow"></span>
  <span id="conn" class="pill">connecting</span>
</header>
<main>
  <div>
    <div id="previewWrap"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
    <p class="hint" id="about"></p>
    <p id="err"></p>
    <div class="card">
      <h3>Everything</h3>
      <div class="row"><button id="bRand" class="grow">Randomise</button><button id="bNudge" class="grow">Nudge</button><button id="bReset" class="grow">Reset</button></div>
    </div>
    <div class="card">
      <h3>Presets</h3>
      <div class="row"><input id="presetName" type="text" class="grow" placeholder="e.g. hex-bloom"><button id="bSave">Save</button></div>
      <div class="row"><select id="presetList" class="grow"></select><button id="bLoad">Load</button></div>
    </div>
    <p class="hint">Every change goes live on any projector surface set to <b>generative</b>
      (<a id="editLink" href="#">mapping editor</a>, content → generative).</p>
  </div>
  <div id="groups"></div>
</main>
<script src="render.js"></script>
<script>
const $ = id => document.getElementById(id);
let SK = null, V = {}, dragging = 0, pushTimer = null, lastPush = 0, pending = {};

// Preview: the projector's own renderer, one full-frame surface showing the sketch.
const R = new MapRenderer($("gl"), $("ov"));
R.layout = { lead_ms: 60, brightness: 1, masks: [], surfaces: [
  { id: "p", content: "gen", opacity: 1, hue_shift: 0, corners: [[0, 0], [1, 0], [1, 1], [0, 1]] }] };
function resize() {
  const r = $("previewWrap").getBoundingClientRect(), d = devicePixelRatio || 1;
  R.resize(Math.round(r.width * d), Math.round(r.height * d));
}
addEventListener("resize", resize); resize();
(function frame(now) { R.draw(now); requestAnimationFrame(frame); })(performance.now());
$("editLink").href = `${location.protocol}//${location.hostname}:8100/edit`;

connectEvents(R, {
  onStatus: ok => { $("conn").textContent = ok ? "live" : "reconnecting"; $("conn").className = "pill" + (ok ? " ok" : ""); },
  onSketch: sk => { SK = sk; build(); refreshSketches(); refreshPresets(); },
  onParams: p => { if (!dragging) { V = p; sync(); } else R.genParams = V; },
});

// ---------- sending changes (throttled; the last value always goes out)
function set(changes) {
  Object.assign(V, changes); Object.assign(pending, changes);
  R.genParams = V;
  clearTimeout(pushTimer);
  const send = () => {
    lastPush = performance.now();
    const body = JSON.stringify(pending); pending = {};
    fetch("/api/params", { method: "POST", body }).catch(() => {});
  };
  if (performance.now() - lastPush > 40) send(); else pushTimer = setTimeout(send, 40);
}

// ---------- UI built from the sketch's schema
const params = () => SK.groups.flatMap(g => g.params);
const fmt = (p, v) => p.step >= 1 ? String(Math.round(v)) : v.toFixed(Math.min(4, Math.max(2, -Math.floor(Math.log10(p.step)))));
const rnd = p => { const v = p.min + Math.random() * (p.max - p.min); return Math.round(v / p.step) * p.step; };

function build() {
  $("about").textContent = SK.about || "";
  $("err").textContent = R.genError || "";
  $("groups").innerHTML = SK.groups.map((g, gi) => `<div class="card"><h3>${g.name}<button data-g="${gi}">random</button></h3>` +
    g.params.map(p => `<div class="p"><label for="r_${p.id}">${p.label}</label><span id="v_${p.id}"></span></div>
      <input type="range" id="r_${p.id}" min="${p.min}" max="${p.max}" step="${p.step}">`).join("") + "</div>").join("");
  for (const p of params()) {
    const el = $("r_" + p.id);
    el.oninput = () => { set({ [p.id]: +el.value }); $("v_" + p.id).textContent = fmt(p, +el.value); };
    el.onpointerdown = () => dragging++;
    el.onpointerup = el.onpointercancel = () => (dragging = Math.max(0, dragging - 1));
  }
  document.querySelectorAll("button[data-g]").forEach(b => b.onclick = () =>
    set(Object.fromEntries(SK.groups[+b.dataset.g].params.filter(p => p.id !== "follow").map(p => [p.id, rnd(p)]))) || sync());
  sync();
}
function sync() {
  if (!SK) return;
  for (const p of params()) {
    const v = V[p.id] ?? p.default;
    $("r_" + p.id).value = v; $("v_" + p.id).textContent = fmt(p, v);
  }
}

$("bRand").onclick = () => { set(Object.fromEntries(params().filter(p => p.id !== "follow").map(p => [p.id, rnd(p)]))); sync(); };
$("bNudge").onclick = () => {
  set(Object.fromEntries(params().filter(p => p.id !== "follow").map(p => {
    const v = (V[p.id] ?? p.default) + (Math.random() - 0.5) * 0.15 * (p.max - p.min);
    return [p.id, Math.min(p.max, Math.max(p.min, Math.round(v / p.step) * p.step))];
  }))); sync();
};
$("bReset").onclick = () => { set(Object.fromEntries(params().map(p => [p.id, p.default]))); sync(); };

// ---------- sketches and presets
async function refreshSketches() {
  const r = await (await fetch("/api/sketches")).json();
  $("sketch").innerHTML = r.sketches.map(n => `<option ${n === r.active ? "selected" : ""}>${n}</option>`).join("");
}
$("sketch").onchange = e => fetch("/api/select", { method: "POST", body: JSON.stringify({ sketch: e.target.value }) });
async function refreshPresets() {
  const r = await (await fetch("/api/presets")).json();
  $("presetList").innerHTML = r.presets.map(n => `<option>${n}</option>`).join("") || "<option value=''>(none saved)</option>";
}
$("bSave").onclick = async () => {
  const n = $("presetName").value.trim(); if (!n) return;
  const r = await fetch(`/api/presets/${encodeURIComponent(n)}`, { method: "POST" });
  if (!r.ok) alert((await r.json()).error); refreshPresets();
};
$("bLoad").onclick = () => { const n = $("presetList").value; if (n) fetch(`/api/presets/${encodeURIComponent(n)}/load`, { method: "POST" }); };
</script>
</body>
</html>
