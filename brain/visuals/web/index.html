<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sektor5 · Visuals</title>

<style>
  :root { --bg: #0c0d14; --card: #151724; --line: #2a2d42; --text: #e8e9f3; --dim: #8a8ea8; --acc: #2fe6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .08em; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #3a2030; color: #f99; }
  .pill.ok { background: #183a2a; color: #8f8; }
  .grow { flex: 1; }
  a { color: var(--acc); }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 420px); gap: 14px; padding: 14px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  #previewWrap { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  #previewWrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); display: flex; }
  .card h3 button { margin-left: auto; font-size: 11px; padding: 2px 8px; }
  .p { display: grid; grid-template-columns: 1fr auto; align-items: center; margin: 4px 0 2px; }
  .p span { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--acc); margin: 0 0 4px; }
  .row { display: flex; gap: 6px; margin: 6px 0; }
  button, select, input[type=text] { font: inherit; color: var(--text); background: #1b1e2e; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  button:active { background: #262a40; }
  .hint { color: var(--dim); font-size: 12px; }
  #err { color: #f88; white-space: pre-wrap; font: 12px ui-monospace, monospace; }

  /* ------------------------------------------------------------------ design system
     Charcoal, hairline grid, one orange accent, light geometric type (Montserrat).
     Same tokens and bottom tiles as the dashboard, Commander, mapping and visuals pages. */
  :root { --bg:#242424; --panel:#2b2b2b; --card:#2b2b2b; --line:#3e3e3e; --line2:#555; --text:#f2f2f2; --dim:#9a9a9a;
          --accent:#ff5a1f; --good:#7ccf8a; --warn:#f2b84b; --bad:#ef5b5b; --well:#1f1f1f;
          --pink:#ff5a1f; --cyan:#ff5a1f; --acc:#ff5a1f; --violet:#bdbdbd;
          --font:"Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  html, body { background: var(--bg); }
  body { font-family: var(--font); letter-spacing: .01em; }
  button, input, select { font-family: var(--font); border-radius: 0 !important; }
  button { background: transparent; border: 1px solid var(--line2); color: var(--text); font-weight: 600; letter-spacing: .08em; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  select, input[type=text], input:not([type]) { background: var(--well); border: 1px solid var(--line2); color: var(--text); }
  input[type=range] { accent-color: var(--accent); }
  .card { border-radius: 0; background: var(--panel); border: 1px solid var(--line); box-shadow: none; }
  .card h2, .card h3 { font-weight: 500; letter-spacing: .16em; color: var(--dim); }
  .pill { border-radius: 0 !important; background: transparent !important; border: 1px solid var(--line2); color: var(--dim);
          font-weight: 600; font-size: 11px; letter-spacing: .12em; }
  .pill.ok { color: var(--good) !important; border-color: var(--good) !important; }
  a { color: var(--accent); }
  nav.apps { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); margin-top: 24px; }
  nav.apps a { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 30px; color: var(--dim);
               text-decoration: none; font-size: 17px; font-weight: 400; line-height: 1.3; border-left: 1px solid var(--line); }
  nav.apps a:first-child { border-left: 0; }
  nav.apps a:hover { color: var(--text); background: #2e2e2e; }
  nav.apps a .arr { font-size: 26px; font-weight: 300; color: var(--text); }
  nav.apps a small { display: block; font-size: 11px; letter-spacing: .16em; color: #6b6b6b; margin-bottom: 4px; }
  nav.apps a.here { background: var(--text); color: #222; }
  nav.apps a.here small { color: #777; }
  nav.apps a.here .arr { background: var(--accent); color: #fff; align-self: stretch; display: grid; place-items: center; width: 80px; margin: -28px -30px -28px 0; }
  @media (max-width: 900px) { nav.apps { grid-template-columns: 1fr 1fr; } nav.apps a:nth-child(3) { border-left: 0; } }

  header { padding: 14px 24px; min-height: 64px; background: var(--bg); }
  header h1 { font-weight: 600; font-size: 14px; letter-spacing: .22em; } header h1 b { color: var(--accent); font-weight: 600; }
  .pill { color: var(--bad) !important; border-color: var(--bad) !important; }
  main { gap: 0; padding: 0; }
  main > div:first-child { padding: 20px 24px; border-right: 1px solid var(--line); }
  main > div:last-child { padding: 20px 24px; }
  #previewWrap { border-radius: 0; }
  .card { margin-bottom: 0; border: 0; border-bottom: 1px solid var(--line); padding: 16px 0; background: transparent; }
  button:active { background: #333; }
  /* Page links in the top bar (Decks / Lighting / Projection / Visuals): the current one underlined. */
  nav.pages { display: flex; gap: 2px; align-self: stretch; }
  nav.pages a { display: flex; align-items: center; padding: 0 12px; color: var(--dim); text-decoration: none; font-size: 14px; font-weight: 500;
                letter-spacing: .01em; text-transform: none; border-bottom: 3px solid transparent; border-top: 3px solid transparent; }
  nav.pages a:hover { color: var(--text); }
  nav.pages a.here { color: var(--text); border-bottom-color: var(--accent); }
  .s5logo { display: inline-flex; align-items: center; vertical-align: middle; line-height: 1; }
  header h1 { display: flex; align-items: center; line-height: 1; overflow: visible; }
  .s5logo .s5word { color: var(--text, #f2f2f2); flex: none; display: block; }
  .s5logo .s5five { fill: var(--accent, #ff5a1f); }

  /* ---- Layout: the display is the hero (full-width band), a clean control panel underneath. ---- */
  main.hl { display: block; padding: 0; gap: 0; max-width: none; }
  .hero { background: #161616; border-bottom: 1px solid var(--line); padding: 24px 24px 0; }
  .herobar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 56px; padding: 12px 0; }
  .herobar .hint { margin: 0; }
  .herobar .sp { flex: 1; }
  .panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-items: stretch; }
  .panel > .card, .panel > #groups > .card { margin: 0; padding: 22px 28px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: transparent; border-radius: 0; }
  .panel > #groups { display: contents; }
  .panel .card h3 { margin: 0 0 14px; font-weight: 500; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .panel .card select.big { width: 100%; font-size: 16px; padding: 10px 12px; margin-bottom: 12px; }
  /* As big as fits: full width, or half the screen height on desktop, always 16:9 like the projector. */
  #previewWrap { width: min(100%, calc(50vh * 16 / 9)); margin: 0 auto; border: 0; position: relative; top: auto; }
  @media (max-width: 760px) { #previewWrap { width: 100%; } }
  /* The display stays in view (just under the top bar) while the controls scroll underneath. */
  .hero { position: sticky; top: 64px; z-index: 30; }
  @media (max-width: 760px) {   /* phones: the display edge to edge, full width; a compact strip under it */
    .hero { padding: 0; }
    .herobar { padding: 6px 12px; min-height: 0; gap: 8px; }
    .herobar .hint { display: none; }
  }

  .panel .card .row { margin: 0 0 10px; }
  .panel #err:empty { display: none; }
  /* Section tabs (under the display, pinned with it): one section of controls at a time. */
  .hero > .s5sect { margin: 0 -24px; }
  .panel.tabbed { display: block; max-width: 860px; margin: 0 auto; }
  .panel.tabbed > .card, .panel.tabbed > #groups > .card { border-right: 0; }
  @media (max-width: 760px) { .hero > .s5sect { margin: 0; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/s5auth.js"></script>
</head>
<body>
<header class="s5bar">
  <h1 class="s5home"><span class="s5logo" aria-label="SEKTOR5"><svg class="s5word" viewBox="0 0 568 100" width="79.52" height="14" aria-hidden="true"><path d="M13,0 L70,0 L70,21 L21,21 L21,40 L57,40 L70,53 L70,87 L57,100 L0,100 L0,79 L49,79 L49,61 L13,61 L0,48 L0,13 ZM96,0 L104,0 L104,100 L96,100 L83,87 L83,13 ZM108,0 L153,0 L153,21 L108,21 ZM108,40 L145,40 L145,61 L108,61 ZM108,79 L153,79 L153,100 L108,100 ZM179,0 L187,0 L187,100 L179,100 L166,87 L166,13 ZM191,34 L209,0 L236,0 L215,50 L236,100 L209,100 L191,66 ZM262,0 L306,0 L319,13 L319,21 L249,21 L249,13 ZM273.5,25 L294.5,25 L294.5,100 L273.5,100 ZM365,0 L350,0 L332,18 L332,82 L350,100 L365,100 L365,79 L358,79 L353,74 L353,26 L358,21 L365,21 ZM369,0 L384,0 L402,18 L402,82 L384,100 L369,100 L369,79 L376,79 L381,74 L381,26 L376,21 L369,21 ZM428,0 L436,0 L436,100 L428,100 L415,87 L415,13 ZM440,0 L472,0 L485,13 L485,48 L473,60 L440,60 L440,39 L464,39 L464,21 L440,21 ZM440,64 L463,64 L485,100 L462,100 Z" fill="currentColor"/><path class="s5five" d="M498,0 L568,0 L568,21 L519,21 L519,40 L555,40 L568,53 L568,87 L555,100 L498,100 L498,79 L547,79 L547,61 L498,61 Z"/></svg></span></h1>
  <nav class="pages" id="pages"><a data-port="8080" data-path="/">Decks</a><a data-port="8090" data-path="/">Lighting</a><a data-port="8100" data-path="/edit">Projection</a><a class="here" data-port="8110" data-path="/">Visuals</a><a data-port="8100" data-path="/stage.html">Stage</a></nav>
</header>
<main class="hl">
  <section class="hero">
    <div id="previewWrap"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
    <div class="herobar">
      <span id="conn" class="pill">connecting</span>
      <span class="hint">Every change goes live on any projector surface set to <b>generative</b>
        (<a id="editLink" data-port="8100" data-path="/edit">mapping editor</a>, content → generative).</span>
    </div>
  </section>
  <section class="panel tabbed">
    <div class="card">
      <h3>Sketch</h3>
      <select id="sketch" class="big" title="The live sketch"></select>
      <p class="hint" id="about"></p>
      <p id="err"></p>
      <div class="row"><button id="bRand" class="grow">Randomise</button><button id="bNudge" class="grow">Nudge</button><button id="bReset" class="grow">Reset</button></div>
      <div class="row"><input id="presetName" type="text" class="grow" placeholder="New preset, e.g. hex-bloom"><button id="bSave">Save</button></div>
      <div class="row"><select id="presetList" class="grow"></select><button id="bLoad">Load</button></div>
    </div>
    <div id="groups"></div>
  </section>
</main>
<script src="render.js"></script>
<script>
const $ = id => document.getElementById(id);
let SK = null, V = {}, dragging = 0, pushTimer = null, lastPush = 0, pending = {};

// Preview: the projector's own renderer, one full-frame surface showing the sketch.
const R = new MapRenderer($("gl"), $("ov"));
R.layout = { lead_ms: 60, brightness: 1, masks: [], surfaces: [
  { id: "p", content: "gen", opacity: 1, hue_shift: 0, corners: [[0, 0], [1, 0], [1, 1], [0, 1]] }] };
function resize() {
  const r = $("previewWrap").getBoundingClientRect(), d = devicePixelRatio || 1;
  R.resize(Math.round(r.width * d), Math.round(r.height * d));
}
addEventListener("resize", resize); resize();
(function frame(now) { R.draw(now); requestAnimationFrame(frame); })(performance.now());

connectEvents(R, {
  onStatus: ok => { $("conn").textContent = ok ? "live" : "reconnecting"; $("conn").className = "pill" + (ok ? " ok" : ""); },
  onSketch: sk => { SK = sk; build(); refreshSketches(); refreshPresets(); },
  onParams: p => { if (!dragging) { V = p; sync(); } else R.genParams = V; },
});

// ---------- sending changes (throttled; the last value always goes out)
function set(changes) {
  Object.assign(V, changes); Object.assign(pending, changes);
  R.genParams = V;
  clearTimeout(pushTimer);
  const send = () => {
    lastPush = performance.now();
    const body = JSON.stringify(pending); pending = {};
    fetch("/api/params", { method: "POST", body }).catch(() => {});
  };
  if (performance.now() - lastPush > 40) send(); else pushTimer = setTimeout(send, 40);
}

// ---------- UI built from the sketch's schema
const params = () => SK.groups.flatMap(g => g.params);
const fmt = (p, v) => p.step >= 1 ? String(Math.round(v)) : v.toFixed(Math.min(4, Math.max(2, -Math.floor(Math.log10(p.step)))));
const rnd = p => { const v = p.min + Math.random() * (p.max - p.min); return Math.round(v / p.step) * p.step; };

function build() {
  $("about").textContent = SK.about || "";
  $("err").textContent = R.genError || "";
  $("groups").innerHTML = SK.groups.map((g, gi) => `<div class="card"><h3>${g.name}<button data-g="${gi}">random</button></h3>` +
    g.params.map(p => `<div class="p"><label for="r_${p.id}">${p.label}</label><span id="v_${p.id}"></span></div>
      <input type="range" id="r_${p.id}" min="${p.min}" max="${p.max}" step="${p.step}">`).join("") + "</div>").join("");
  for (const p of params()) {
    const el = $("r_" + p.id);
    el.oninput = () => { set({ [p.id]: +el.value }); $("v_" + p.id).textContent = fmt(p, +el.value); };
    el.onpointerdown = () => dragging++;
    el.onpointerup = el.onpointercancel = () => (dragging = Math.max(0, dragging - 1));
  }
  document.querySelectorAll("button[data-g]").forEach(b => b.onclick = () =>
    set(Object.fromEntries(SK.groups[+b.dataset.g].params.filter(p => p.id !== "follow").map(p => [p.id, rnd(p)]))) || sync());
  sync();
}
function sync() {
  if (!SK) return;
  for (const p of params()) {
    const v = V[p.id] ?? p.default;
    $("r_" + p.id).value = v; $("v_" + p.id).textContent = fmt(p, v);
  }
}

$("bRand").onclick = () => { set(Object.fromEntries(params().filter(p => p.id !== "follow").map(p => [p.id, rnd(p)]))); sync(); };
$("bNudge").onclick = () => {
  set(Object.fromEntries(params().filter(p => p.id !== "follow").map(p => {
    const v = (V[p.id] ?? p.default) + (Math.random() - 0.5) * 0.15 * (p.max - p.min);
    return [p.id, Math.min(p.max, Math.max(p.min, Math.round(v / p.step) * p.step))];
  }))); sync();
};
$("bReset").onclick = () => { set(Object.fromEntries(params().map(p => [p.id, p.default]))); sync(); };

// ---------- sketches and presets
async function refreshSketches() {
  const r = await (await fetch("/api/sketches")).json();
  $("sketch").innerHTML = r.sketches.map(n => `<option ${n === r.active ? "selected" : ""}>${n}</option>`).join("");
}
$("sketch").onchange = e => fetch("/api/select", { method: "POST", body: JSON.stringify({ sketch: e.target.value }) });
async function refreshPresets() {
  const r = await (await fetch("/api/presets")).json();
  $("presetList").innerHTML = r.presets.map(n => `<option>${n}</option>`).join("") || "<option value=''>(none saved)</option>";
}
$("bSave").onclick = async () => {
  const n = $("presetName").value.trim(); if (!n) return;
  const r = await fetch(`/api/presets/${encodeURIComponent(n)}`, { method: "POST" });
  if (!r.ok) alert((await r.json()).error); refreshPresets();
};
$("bLoad").onclick = () => { const n = $("presetList").value; if (n) fetch(`/api/presets/${encodeURIComponent(n)}/load`, { method: "POST" }); };

// Section tabs under the display (shared, /s5auth.js).
if (window.S5AUTH && S5AUTH.sectionTabs) S5AUTH.sectionTabs({ panel: document.querySelector(".panel"), mount: document.querySelector(".hero"),
  items: () => [...document.querySelectorAll(".panel > .card, .panel > #groups > .card")], title: c => (c.querySelector("h3").firstChild.textContent || "").trim() });
</script>
</body>
</html>
